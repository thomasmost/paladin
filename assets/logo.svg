<?xml version="1.0" encoding="UTF-8"?>
<!-- Paladin logo: the knight-on-pegasus artwork in logo.png, framed by a
     white rounded tile with a black border. The artwork is the editable
     source; this file only frames it. The image is inset so the lance tip
     and wing clear the rounded corners. No text elements, so icon
     generation never depends on installed fonts. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <clipPath id="tile">
      <rect x="24" y="24" width="976" height="976" rx="200" ry="200"/>
    </clipPath>
  </defs>
  <rect x="24" y="24" width="976" height="976" rx="200" ry="200" fill="#fff"/>
  <image href="logo.png" x="72" y="72" width="880" height="880" clip-path="url(#tile)"/>
  <rect x="24" y="24" width="976" height="976" rx="200" ry="200" fill="none" stroke="#000" stroke-width="28"/>
</svg>

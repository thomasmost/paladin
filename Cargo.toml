[workspace]
members = ["crates/paladin-engine", "crates/paladin", "xtask"]
# `cargo run` with no package flag runs the browser.
default-members = ["crates/paladin"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[workspace.dependencies]
# The shared shell (model, chrome, winit app): https://github.com/thomasmost/osmena.
# Pinned by revision; the crates version together, so move every `rev` at
# once. For local work, patch the source to a checkout in
# ~/.cargo/config.toml (see osmena's README). osmena pins winit, egui, and
# glow to the versions Servo 0.7.0's own shell uses; they share a GL
# context and raw window handles with Servo, so a Servo bump that moves
# them is an osmena bump first (see CLAUDE.md).
osmena-core = { git = "https://github.com/thomasmost/osmena", rev = "435e054cd9b69506c55a9e730c858c4f6bbe8f33" }
osmena-engine = { git = "https://github.com/thomasmost/osmena", rev = "435e054cd9b69506c55a9e730c858c4f6bbe8f33" }
osmena-shell = { git = "https://github.com/thomasmost/osmena", rev = "435e054cd9b69506c55a9e730c858c4f6bbe8f33" }
osmena-xtask = { git = "https://github.com/thomasmost/osmena", rev = "435e054cd9b69506c55a9e730c858c4f6bbe8f33" }
# Servo's own GL crates, at the versions it pins.
glow = "=0.17.0"
surfman = "=0.14.0"
raw-window-handle = "0.6"
dpi = "0.1"
euclid = "0.22"
keyboard-types = { version = "0.8.3", features = ["serde"] }
url = { version = "2.5", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
log = "0.4"

[profile.release]
# Line tables only: enough to symbolize a crash dump or a cdb stack from the
# PDB (Windows) or dSYM (macOS) that CI uploads next to the installer, without
# changing the generated code. Neither file ships in the installer.
debug = "line-tables-only"

[profile.dev.package.servo-script]
# Servo's own workspace sets this too: with the default 256 codegen units
# the debug rlib of the script crate passes 4 GB on Windows, the archive
# index wraps, and the final link fails with hundreds of unresolved
# externals (rust-lang/rust#151184; docs/upstream-issues.md T3). Profile
# overrides in a dependency's workspace do not apply here, so repeat it.
codegen-units = 16

# Servo and stylo build from Paladin's forks so the browser can carry its own
# patches. The dist branches hold only the files a build needs; the dev
# branches (paladin/<version>) hold the patch commits. The fork manifests
# keep the upstream versions, so the exact pins above and in
# crates/paladin-engine/Cargo.toml still apply. Move all crates of one repo
# at once with `cargo update -p servo --precise <sha>` or
# `cargo update -p stylo --precise <sha>`. See CLAUDE.md for the bump and
# local-loop procedures.
[patch.crates-io]
servo = { git = "https://github.com/thomasmost/servo.git", branch = "dist/paladin-0.7.0" }
servo-allocator = { git = "https://github.com/thomasmost/servo.git", branch = "dist/paladin-0.7.0" }

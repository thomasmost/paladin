name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # CI never edits and rebuilds, so incremental artifacts only bloat the cache.
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Servo is a long build; the first run on each runner can exceed an hour.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon, like the development Mac.
          - os: macos-15
            check-icons: true
          - os: windows-2025
            check-icons: false
    steps:
      - uses: actions/checkout@v7

      # dtolnay/rust-toolchain does not read rust-toolchain.toml; keep the
      # version in sync with it so rustup installs one toolchain, not two.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      # Servo's WebIDL code generation runs Python at build time.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # bindgen (used by Servo's ANGLE bindings) loads libclang at build time.
      - name: Install LLVM (Windows)
        if: runner.os == 'Windows'
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "20.1"
      - name: Set LIBCLANG_PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "LIBCLANG_PATH=$env:LLVM_PATH\bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # rust-cache alone, no sccache: the repository's cache budget is 10 GB.
      # The four target caches (check and package on each runner) took about
      # 8 GB when measured on 2026-10-15. With the fork sources the two check
      # caches measured 2.3 GB (macOS) and 3.4 GB (Windows) on the same date.
      # The package caches were not measured with the fork sources, because
      # the package job is skipped on pull requests. Projected total: about
      # 9 GB (8 GB plus about 1.1 GB of measured growth), close to the limit.
      # Re-measure the package caches after the first main run with the fork
      # sources (gh cache list). If the total exceeds 10 GB, revisit what
      # rust-cache saves. sccache added thousands of small entries that
      # pushed the total over the limit, and GitHub then evicted the target
      # caches, which are what make a warm run take minutes instead of an
      # hour.
      #
      # rust-cache's key hashes every installed toolchain. The runner image
      # ships its own stable rustc, which differs between image versions and
      # changed the key between consecutive Windows runs, forcing cold Servo
      # builds. Uninstalling the image's toolchains leaves only the pinned
      # one in that hash, so the key then changes only with the pinned
      # toolchain, rust-toolchain.toml, .cargo/config.toml, the manifests,
      # Cargo.lock, and the CARGO*, RUST*, CC*, CXX*, CFLAGS* and CMAKE*
      # environment variables.
      - name: Remove the runner image's preinstalled toolchains
        shell: bash
        run: |
          active=$(rustup show active-toolchain | cut -d' ' -f1)
          for toolchain in $(rustup toolchain list --quiet); do
            if [ "$toolchain" != "$active" ]; then
              rustup toolchain uninstall "$toolchain"
            fi
          done
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --workspace --all-targets

      # The engine links libEGL.dll and loads it by name at runtime; the
      # test binaries need it beside them.
      - name: Copy ANGLE DLLs next to the binaries (Windows)
        if: runner.os == 'Windows'
        run: cargo xtask angle-dlls debug

      - run: cargo test --workspace

      # tiny-skia's output is not guaranteed identical across CPU
      # architectures, so only the Apple Silicon runner diffs the icons.
      - name: Icons are up to date
        if: matrix.check-icons
        run: |
          cargo xtask icons
          git diff --exit-code -- assets/icons

  package:
    name: package ${{ matrix.os }}
    needs: check
    # Packaging runs on pushes to main only, as the README says.
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    env:
      # The build number the browser compares with the release manifest
      # (`Brand::build`, read at compile time); the release job tags the
      # release with the same number.
      OSMENA_BUILD_NUMBER: ${{ github.run_number }}
      # The Google OAuth client id for the Launch Panel's Drive tile
      # (`Brand::google_client_id`): a repository variable, set once by
      # the owner (docs/LaunchPanelOps.md in browser-project). Unset, the
      # build simply has no Drive tile.
      PALADIN_GOOGLE_CLIENT_ID: ${{ vars.PALADIN_GOOGLE_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install LLVM (Windows)
        if: runner.os == 'Windows'
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "20.1"
      - name: Set LIBCLANG_PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "LIBCLANG_PATH=$env:LLVM_PATH\bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      # Same toolchain clean-up and cache settings as the check job, for the
      # same reasons.
      - name: Remove the runner image's preinstalled toolchains
        shell: bash
        run: |
          active=$(rustup show active-toolchain | cut -d' ' -f1)
          for toolchain in $(rustup toolchain list --quiet); do
            if [ "$toolchain" != "$active" ]; then
              rustup toolchain uninstall "$toolchain"
            fi
          done
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # rust-cache restores ~/.cargo/bin, so this is a no-op after the first run.
      - run: cargo install cargo-packager --version 0.11.8 --locked

      - run: cargo build --release -p paladin
      - name: Copy ANGLE DLLs next to the binary (Windows)
        if: runner.os == 'Windows'
        run: cargo xtask angle-dlls release

      # macOS: Paladin.app and a .dmg. Windows: an NSIS installer. The
      # installer and the .dmg are uploaded; a bare .app loses its
      # executable bits in a zipped artifact, and the .dmg contains it.
      - run: cargo packager --release -p paladin

      # The update check installs from a zip of the bundle (ditto keeps
      # the executable bits and the signature); the zip carries the
      # architecture like Nautilus's. The dSYM is zipped the same way.
      - if: runner.os == 'macOS'
        name: Zip the bundle
        run: |
          cd target/release
          arch=$(uname -m)
          ditto -c -k --keepParent Paladin.app "Paladin-macos-$arch.zip"
          # cargo leaves no dSYM beside the binary; make one from its
          # line tables, as Nautilus's job does.
          dsymutil paladin -o Paladin.dSYM
          ditto -c -k --keepParent Paladin.dSYM "Paladin-$arch.dSYM.zip"

      # The symbol file (PDB on Windows, dSYM on macOS) from the release
      # profile's line tables is uploaded next to the installer so a crash in
      # an installed build can be symbolized (the wikipedia.org crash in
      # docs/upstream-issues.md needed one). It is not part of the installer.
      - uses: actions/upload-artifact@v7
        with:
          name: paladin-${{ matrix.os }}
          path: |
            target/release/*.dmg
            target/release/Paladin-macos-*.zip
            target/release/Paladin-*.dSYM.zip
            target/release/*-setup.exe
            target/release/paladin.pdb
          if-no-files-found: error

  # Every green push to main is a GitHub release, tagged by the run
  # number, carrying the installers and bundles the package job built,
  # their symbols, and `latest.toml`: the manifest the browser's update
  # check fetches at `releases/latest/download/latest.toml` (osmena's
  # `update::Manifest`; ci/update-manifest.sh writes it). The build
  # number inside the browser is the same run number (OSMENA_BUILD_NUMBER
  # in the package job), which is how a running build knows a release is
  # newer. A rerun of a run replaces its release.
  release:
    name: release
    needs: package
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
      - name: Manifest
        id: manifest
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          tag="build-${{ github.run_number }}"
          release_url="${{ github.server_url }}/${{ github.repository }}/releases/tag/$tag"
          # An artifact keeps the files' paths below their common parent,
          # which may nest them: find every asset by name.
          find artifacts -type f | sort
          asset() { find artifacts -type f -name "$1" | head -1; }
          bash ci/update-manifest.sh "$version" "${{ github.run_number }}" "${{ github.sha }}" "$release_url" latest.toml \
            "windows-x86_64=$(asset '*-setup.exe')" \
            "macos-aarch64=$(asset Paladin-macos-arm64.zip)"
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "files<<EOF"
            asset '*-setup.exe'
            asset paladin.pdb
            asset '*.dmg'
            asset Paladin-macos-arm64.zip
            asset Paladin-arm64.dSYM.zip
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.manifest.outputs.tag }}"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "replacing the release of an earlier attempt of this run"
            gh release delete "$tag" --yes --cleanup-tag
          fi
          readarray -t files <<< "${{ steps.manifest.outputs.files }}"
          gh release create "$tag" \
            --title "Paladin ${{ steps.manifest.outputs.version }} (build ${{ github.run_number }})" \
            --generate-notes --latest \
            latest.toml "${files[@]}"

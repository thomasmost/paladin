name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # CI never edits and rebuilds, so incremental artifacts only bloat the cache.
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Servo is a long build; the first run on each runner can exceed an hour.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon, like the development Mac.
          - os: macos-15
            check-icons: true
          - os: windows-2025
            check-icons: false
    steps:
      - uses: actions/checkout@v7

      # dtolnay/rust-toolchain does not read rust-toolchain.toml; keep the
      # version in sync with it so rustup installs one toolchain, not two.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      # Servo's WebIDL code generation runs Python at build time.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # bindgen (used by Servo's ANGLE bindings) loads libclang at build time.
      - name: Install LLVM (Windows)
        if: runner.os == 'Windows'
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "20.1"
      - name: Set LIBCLANG_PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "LIBCLANG_PATH=$env:LLVM_PATH\bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # rust-cache alone, no sccache: the repository's cache budget is 10 GB
      # and the four target caches (check and package on each runner) took
      # about 8 GB when measured on 2026-10-15. sccache added thousands of
      # small entries that pushed the total over the limit, and GitHub then
      # evicted the target caches, which are what make a warm run take
      # minutes instead of an hour.
      #
      # rust-cache's key hashes every installed toolchain. The runner image
      # ships its own stable rustc, which differs between image versions and
      # changed the key between consecutive Windows runs, forcing cold Servo
      # builds. Uninstalling the image's toolchains leaves only the pinned
      # one in that hash, so the key then changes only with
      # rust-toolchain.toml, the manifests, and Cargo.lock, which rust-cache
      # hashes as well.
      - name: Remove the runner image's preinstalled toolchains
        shell: bash
        run: |
          active=$(rustup show active-toolchain | cut -d' ' -f1)
          for toolchain in $(rustup toolchain list --quiet); do
            if [ "$toolchain" != "$active" ]; then
              rustup toolchain uninstall "$toolchain"
            fi
          done
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --workspace --all-targets

      # The engine links libEGL.dll and loads it by name at runtime; the
      # test binaries need it beside them.
      - name: Copy ANGLE DLLs next to the binaries (Windows)
        if: runner.os == 'Windows'
        run: cargo xtask angle-dlls debug

      - run: cargo test --workspace

      # tiny-skia's output is not guaranteed identical across CPU
      # architectures, so only the Apple Silicon runner diffs the icons.
      - name: Icons are up to date
        if: matrix.check-icons
        run: |
          cargo xtask icons
          git diff --exit-code -- assets/icons

  package:
    name: package ${{ matrix.os }}
    needs: check
    # Packaging runs on pushes to main only, as the README says.
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install LLVM (Windows)
        if: runner.os == 'Windows'
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "20.1"
      - name: Set LIBCLANG_PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "LIBCLANG_PATH=$env:LLVM_PATH\bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      # Same toolchain clean-up and cache settings as the check job, for the
      # same reasons.
      - name: Remove the runner image's preinstalled toolchains
        shell: bash
        run: |
          active=$(rustup show active-toolchain | cut -d' ' -f1)
          for toolchain in $(rustup toolchain list --quiet); do
            if [ "$toolchain" != "$active" ]; then
              rustup toolchain uninstall "$toolchain"
            fi
          done
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # rust-cache restores ~/.cargo/bin, so this is a no-op after the first run.
      - run: cargo install cargo-packager --version 0.11.8 --locked

      - run: cargo build --release -p paladin
      - name: Copy ANGLE DLLs next to the binary (Windows)
        if: runner.os == 'Windows'
        run: cargo xtask angle-dlls release

      # macOS: Paladin.app and a .dmg. Windows: an NSIS installer. The
      # installer and the .dmg are uploaded; a bare .app loses its
      # executable bits in a zipped artifact, and the .dmg contains it.
      - run: cargo packager --release -p paladin

      - uses: actions/upload-artifact@v7
        with:
          name: paladin-${{ matrix.os }}
          path: |
            target/release/*.dmg
            target/release/*-setup.exe
          if-no-files-found: error

<!doctype html>
<meta charset="utf-8">
<title>finish-method</title>
<div id="box" style="width:50px;height:50px;background:teal"></div>
<script>
let settled = false;
const verdict = (title) => { if (!settled) { settled = true; document.title = title; } };
const fail = (reason) => verdict('FAIL: ' + reason);
addEventListener('error', (event) => fail(event.message));
setTimeout(() => fail('did not settle within 5s'), 5000);

(async () => {
  const box = document.getElementById('box');
  const anim = box.animate([{ opacity: 1 }, { opacity: 0 }], 1000);
  const fired = new Promise((resolve) => { anim.onfinish = resolve; });
  anim.finish();
  if (anim.currentTime !== 1000) return fail('currentTime after finish() is ' + anim.currentTime);
  if (anim.playState !== 'finished') return fail('playState after finish() is ' + anim.playState);
  if (anim.pending) return fail('pending after finish() is true');
  const [settledAnim, event] = await Promise.all([anim.finished, fired]);
  if (settledAnim !== anim) return fail('finished resolved with another value');
  if (event.type !== 'finish') return fail('event type is ' + event.type);
  if (event.currentTime !== 1000) return fail('event.currentTime is ' + event.currentTime);
  if (event.target !== anim) return fail('event.target is not the animation');

  // An animation with an infinite effect end cannot be finished.
  const endless = box.animate([{ opacity: 1 }, { opacity: 0 }],
    { duration: 100, iterations: Infinity });
  try {
    endless.finish();
    return fail('finish() on an infinite animation did not throw');
  } catch (e) {
    if (e.name !== 'InvalidStateError') return fail('finish() threw ' + e.name);
  }
  verdict('PASS');
})().catch((e) => fail(e.message));
</script>

<!doctype html>
<meta charset="utf-8">
<title>cancel-paused-no-frame</title>
<div id="box" style="width:50px;height:50px;background:teal"></div>
<script>
let settled = false;
const verdict = (title) => { if (!settled) { settled = true; document.title = title; } };
const fail = (reason) => verdict('FAIL: ' + reason);
addEventListener('error', (event) => fail(event.message));
setTimeout(() => fail('no cancel event within 5s'), 5000);

// The cancel is requested from a timer, with no animation running and no
// animation frame requested: the document must still dispatch the event.
(async () => {
  const anim = document.getElementById('box').animate(
    [{ opacity: 1 }, { opacity: 0 }], 10000);
  anim.pause();
  await anim.ready;
  if (anim.playState !== 'paused') return fail('playState after pause is ' + anim.playState);
  // Wait until the document is idle: no rendering update may be pending.
  setTimeout(() => {
    anim.oncancel = (event) => {
      if (anim.playState !== 'idle') return fail('playState in oncancel is ' + anim.playState);
      if (event.type !== 'cancel') return fail('event type is ' + event.type);
      if (event.currentTime !== null) return fail('event.currentTime is ' + event.currentTime);
      verdict('PASS');
    };
    anim.cancel();
  }, 300);
})().catch((e) => fail(e.message));
</script>

<!doctype html>
<meta charset="utf-8">
<title>paused-resample</title>
<div id="box" style="width:50px;height:50px;background:teal"></div>
<script>
let settled = false;
const verdict = (title) => { if (!settled) { settled = true; document.title = title; } };
const fail = (reason) => verdict('FAIL: ' + reason);
addEventListener('error', (event) => fail(event.message));
setTimeout(() => fail('did not settle within 5s'), 5000);
const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
const opacity = () => parseFloat(getComputedStyle(document.getElementById('box')).opacity);

(async () => {
  const box = document.getElementById('box');
  // Paused animations are not ticked, so nothing but the update itself
  // schedules the resample: a timer, not a frame, gives the page time to show it.
  const anim = box.animate([{ opacity: 1 }, { opacity: 0 }], 2000);
  anim.pause();
  anim.currentTime = 0;
  await anim.ready;
  await wait(300);
  if (opacity() !== 1) return fail('opacity at currentTime 0 is ' + opacity());
  anim.currentTime = 1000;
  await wait(300);
  if (Math.abs(opacity() - 0.5) > 0.01) return fail('opacity after seeking to 1000ms is ' + opacity());
  anim.effect.setKeyframes([{ opacity: 0.8 }, { opacity: 0.8 }]);
  await wait(300);
  if (Math.abs(opacity() - 0.8) > 0.01) return fail('opacity after setKeyframes is ' + opacity());
  verdict('PASS');
})().catch((e) => fail(e.message));
</script>

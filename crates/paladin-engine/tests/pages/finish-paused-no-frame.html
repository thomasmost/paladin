<!doctype html>
<meta charset="utf-8">
<title>finish-paused-no-frame</title>
<div id="box" style="width:50px;height:50px;background:teal"></div>
<script>
let settled = false;
const verdict = (title) => { if (!settled) { settled = true; document.title = title; } };
const fail = (reason) => verdict('FAIL: ' + reason);
addEventListener('error', (event) => fail(event.message));
setTimeout(() => fail('no finish event within 5s'), 5000);

// finish() on a paused animation is called from a timer, with no animation
// running and no animation frame requested: onfinish must still fire.
(async () => {
  const anim = document.getElementById('box').animate(
    [{ opacity: 1 }, { opacity: 0 }], 10000);
  anim.pause();
  await anim.ready;
  // Wait until the document is idle: no rendering update may be pending.
  setTimeout(() => {
    anim.onfinish = (event) => {
      if (anim.playState !== 'finished') return fail('playState in onfinish is ' + anim.playState);
      if (anim.currentTime !== 10000) return fail('currentTime in onfinish is ' + anim.currentTime);
      if (event.type !== 'finish') return fail('event type is ' + event.type);
      if (event.currentTime !== 10000) return fail('event.currentTime is ' + event.currentTime);
      verdict('PASS');
    };
    anim.finish();
  }, 300);
})().catch((e) => fail(e.message));
</script>

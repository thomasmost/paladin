<!doctype html>
<meta charset="utf-8">
<title>hidden-target-resumes</title>
<div id="box" style="width:50px;height:50px;background:teal"></div>
<script>
let settled = false;
const verdict = (title) => { if (!settled) { settled = true; document.title = title; } };
const fail = (reason) => verdict('FAIL: ' + reason);
addEventListener('error', (event) => fail(event.message));
setTimeout(() => fail('did not settle within 5s'), 5000);
const frame = () => new Promise((resolve) => requestAnimationFrame(resolve));
const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
const opacity = () => parseFloat(getComputedStyle(document.getElementById('box')).opacity);

(async () => {
  const box = document.getElementById('box');
  const anim = box.animate([{ opacity: 0.2 }, { opacity: 0.2 }], { duration: 10000 });
  await anim.ready;
  await frame();
  if (opacity() !== 0.2) return fail('opacity while shown is ' + opacity());
  // While hidden the target is not rendered; the animation keeps running.
  box.style.display = 'none';
  await wait(200);
  box.style.display = '';
  await frame();
  await frame();
  if (opacity() !== 0.2) return fail('opacity after showing the target again is ' + opacity());
  anim.cancel();
  verdict('PASS');
})().catch((e) => fail(e.message));
</script>

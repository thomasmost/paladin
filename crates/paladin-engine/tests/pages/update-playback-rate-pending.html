<!doctype html>
<meta charset="utf-8">
<title>update-playback-rate-pending</title>
<div id="box" style="width:50px;height:50px;background:teal"></div>
<script>
let settled = false;
const verdict = (title) => { if (!settled) { settled = true; document.title = title; } };
const fail = (reason) => verdict('FAIL: ' + reason);
addEventListener('error', (event) => fail(event.message));
setTimeout(() => fail('did not settle within 5s'), 5000);

(async () => {
  const anim = document.getElementById('box').animate(
    [{ opacity: 1 }, { opacity: 0 }], 10000);
  if (!anim.pending) return fail('not pending right after animate()');
  // A play task is pending, so the new rate waits for the ready time.
  anim.updatePlaybackRate(2);
  if (!anim.pending) return fail('pending is false after updatePlaybackRate() during a play');
  if (anim.playbackRate !== 1) return fail('playbackRate before ready is ' + anim.playbackRate);
  await anim.ready;
  if (anim.pending) return fail('still pending after ready');
  if (anim.playbackRate !== 2) return fail('playbackRate after ready is ' + anim.playbackRate);
  // The rate applies from the ready time: no jump from the held time 0.
  if (!(anim.currentTime >= 0 && anim.currentTime < 200)) {
    return fail('currentTime at ready is ' + anim.currentTime + ' (expected no jump)');
  }
  // Then time runs at the new rate.
  const startedAt = performance.now();
  const startTime = anim.currentTime;
  await new Promise((resolve) => setTimeout(resolve, 300));
  const elapsed = performance.now() - startedAt;
  const advanced = anim.currentTime - startTime;
  if (advanced < elapsed * 1.3 || advanced > elapsed * 2.7) {
    return fail('advanced ' + advanced + 'ms in ' + elapsed + 'ms at rate 2');
  }
  verdict('PASS');
})().catch((e) => fail(e.message));
</script>

<!doctype html>
<meta charset="utf-8">
<title>seek-end-finish-event</title>
<div id="box" style="width:50px;height:50px;background:teal"></div>
<script>
let settled = false;
const verdict = (title) => { if (!settled) { settled = true; document.title = title; } };
const fail = (reason) => verdict('FAIL: ' + reason);
addEventListener('error', (event) => fail(event.message));
setTimeout(() => fail('no finish event within 5s'), 5000);

// A running animation is seeked to its end from a timer. The seek finishes
// it from a microtask, which queues the finish event after the timer. No
// animation is running afterwards, so the event must still be dispatched
// without any animation frame.
(async () => {
  const anim = document.getElementById('box').animate(
    [{ opacity: 1 }, { opacity: 0 }], 10000);
  await anim.ready;
  // Seeking a running animation to its end finishes it through the microtask
  // path, and that path must fire finish. The seek runs from a timer, after
  // the animation has started.
  setTimeout(() => {
    anim.onfinish = (event) => {
      if (anim.playState !== 'finished') return fail('playState in onfinish is ' + anim.playState);
      if (event.currentTime !== 10000) return fail('event.currentTime is ' + event.currentTime);
      verdict('PASS');
    };
    anim.currentTime = 10000;
  }, 300);
})().catch((e) => fail(e.message));
</script>

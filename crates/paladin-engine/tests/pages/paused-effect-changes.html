<!doctype html>
<meta charset="utf-8">
<title>paused-effect-changes</title>
<div id="box" style="width:50px;height:50px;background:teal"></div>
<div id="other" style="width:50px;height:50px;background:teal"></div>
<script>
let settled = false;
const verdict = (title) => { if (!settled) { settled = true; document.title = title; } };
const fail = (reason) => verdict('FAIL: ' + reason);
// Every check runs; the verdict lists each one that failed.
const failures = [];
const record = (reason) => failures.push(reason);
addEventListener('error', (event) => fail(event.message));
setTimeout(() => fail('did not settle within 10s'), 10000);
const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
const opacityOf = (id) => parseFloat(getComputedStyle(document.getElementById(id)).opacity);
// The translation of a matrix(a, b, c, d, e, f) transform, in px.
const translateX = (id) => {
  const transform = getComputedStyle(document.getElementById(id)).transform;
  if (transform === 'none') return 0;
  const match = transform.match(/matrix\(([^)]*)\)/);
  return match ? parseFloat(match[1].split(',')[4]) : NaN;
};

(async () => {
  const box = document.getElementById('box');
  const other = document.getElementById('other');
  // Paused animations are not ticked: each change below must schedule its own
  // resample, and a timer (not a frame) gives the page time to show it.

  // effect.target on a paused animation: the old target reverts, the new one
  // takes the sampled value.
  const retarget = box.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 2000, fill: 'both' });
  retarget.pause();
  retarget.currentTime = 1000;
  await retarget.ready;
  await wait(300);
  if (Math.abs(opacityOf('box') - 0.5) > 0.01) record('before retarget box renders ' + opacityOf('box'));
  retarget.effect.target = other;
  await wait(300);
  if (opacityOf('box') !== 1) record('old target after retarget renders ' + opacityOf('box'));
  if (Math.abs(opacityOf('other') - 0.5) > 0.01) record('new target after retarget renders ' + opacityOf('other'));
  retarget.cancel();

  // effect.composite on a paused animation: the sampled value adds to the base.
  box.style.opacity = '0.5';
  const composite = box.animate([{ opacity: 0.2 }, { opacity: 0.2 }], { duration: 2000, fill: 'both' });
  composite.pause();
  composite.currentTime = 0;
  await composite.ready;
  await wait(300);
  if (Math.abs(opacityOf('box') - 0.2) > 0.01) record('replace renders ' + opacityOf('box'));
  composite.effect.composite = 'add';
  await wait(300);
  if (Math.abs(opacityOf('box') - 0.7) > 0.01) record('add renders ' + opacityOf('box'));
  composite.cancel();
  box.style.opacity = '';

  // finish() on a paused animation that fills forwards: the end value shows.
  const finishFilled = box.animate([{ transform: 'translateX(0px)' }, { transform: 'translateX(100px)' }], { duration: 1000, fill: 'forwards' });
  finishFilled.pause();
  finishFilled.currentTime = 0;
  await finishFilled.ready;
  await wait(300);
  if (Math.abs(translateX('box') - 0) > 0.5) record('paused at 0ms translates ' + translateX('box'));
  finishFilled.finish();
  await wait(300);
  if (Math.abs(translateX('box') - 100) > 0.5) record('finished paused animation translates ' + translateX('box'));
  finishFilled.cancel();

  // finish() on a paused animation without a fill: the value reverts.
  const finishBare = box.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 1000 });
  finishBare.pause();
  finishBare.currentTime = 500;
  await finishBare.ready;
  await wait(300);
  if (Math.abs(opacityOf('box') - 0.5) > 0.01) record('paused at 500ms renders ' + opacityOf('box'));
  finishBare.finish();
  await wait(300);
  if (opacityOf('box') !== 1) record('finished without fill renders ' + opacityOf('box'));
  finishBare.cancel();

  // updatePlaybackRate() on a paused animation at its end, with no fill: the
  // sign flip puts it in effect at the end keyframe, and that must render.
  const rate = box.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 1000 });
  rate.pause();
  rate.currentTime = 1000;
  await rate.ready;
  await wait(300);
  if (opacityOf('box') !== 1) record('paused at its end without fill renders ' + opacityOf('box'));
  rate.updatePlaybackRate(-1);
  await wait(300);
  if (Math.abs(opacityOf('box') - 0) > 0.01) record('after updatePlaybackRate(-1) renders ' + opacityOf('box'));
  rate.cancel();

  verdict(failures.length ? 'FAIL: ' + failures.join('; ') : 'PASS');
})().catch((e) => fail(e.message));
</script>

[package]
name = "paladin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Paladin desktop browser"

[[bin]]
name = "paladin"
path = "src/main.rs"

[dependencies]
paladin-engine = { path = "../paladin-engine" }
osmena-shell = { workspace = true }
clap = { version = "4", features = ["derive"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# `cargo packager --release -p paladin`, run from the workspace root. The
# hook below builds the release binary first, so packaging never bundles a
# stale one. On Windows, `cargo xtask angle-dlls release` stays a separate
# step: the DLLs it copies are picked up by the `resources` glob.
[package.metadata.packager]
product-name = "Paladin"
identifier = "org.paladin.software"
# Runs through `sh -c` on macOS and `cmd /C` on Windows, from the directory
# cargo-packager was started in (the workspace root).
before-packaging-command = "cargo build --release -p paladin"
# cargo-packager resolves these relative paths against this crate's directory.
icons = ["../../assets/icons/paladin.icns", "../../assets/icons/paladin.ico", "../../assets/icons/paladin-256.png"]
# No `formats` list: cargo-packager 0.11.8 builds every listed format and
# fails on the ones the host cannot make, so the per-host default is used
# instead (app and dmg on macOS, nsis on Windows).
# Windows: the ANGLE DLLs that `cargo xtask angle-dlls release` copied next
# to the binary, installed beside paladin.exe. The glob matches nothing on
# macOS. It assumes the default target directory and no `--target` flag: with
# `CARGO_TARGET_DIR` or `--target <triple>` the glob matches nothing and the
# installer silently ships without the DLLs.
resources = ["../../target/release/*.dll"]

[package.metadata.packager.macos]
minimum-system-version = "12.0"

[package.metadata.packager.nsis]
installer-icon = "../../assets/icons/paladin.ico"
installer-mode = "currentUser"
